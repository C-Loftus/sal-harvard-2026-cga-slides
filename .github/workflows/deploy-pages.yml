name: Deploy slides to GitHub Pages

# Every push to main builds the deck as a static site and publishes it to
# GitHub Pages at https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages serves project sites under /<repo>/, so the deck needs that base.
      # Copying index.html to 404.html lets direct links to /<repo>/12 load the SPA.
      - name: Build HTML
        run: |
          npx slidev build slides.md --base "/${{ github.event.repository.name }}/" --out dist
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
